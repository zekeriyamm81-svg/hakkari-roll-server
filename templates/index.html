<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Hakkari Roll</title><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/static/app.css"></head><body><div id="toast"></div>
<section id="authView" class="auth"><div class="auth-card"><div class="logo">HAKKARİ <span>ROLL</span></div><div class="tag">Hakkari'nin otomobil topluluğu</div><div id="loginBox"><input id="loginUser" placeholder="Kullanıcı adı"><input id="loginPass" type="password" placeholder="Şifre"><button onclick="login()">GİRİŞ YAP</button><button class="ghost" onclick="showRegister()">HESAP OLUŞTUR</button></div><div id="registerBox" class="hidden"><input id="regName" placeholder="Görünen ad"><input id="regUser" placeholder="Kullanıcı adı"><input id="regPass" type="password" placeholder="Şifre"><button onclick="register()">KAYIT OL</button><button class="ghost" onclick="showLogin()">GERİ</button></div></div></section>
<section id="appView" class="hidden"><header><div class="logo small">HAKKARİ <span>ROLL</span></div><button class="danger" onclick="logout()">ÇIKIŞ</button></header><nav id="nav"></nav><main>
<section id="feedPage" class="page"><div class="card"><textarea id="postBody" placeholder="Bir şey paylaş..."></textarea><input id="postPhoto" type="file" accept="image/*"><button onclick="createPost()">PAYLAŞ</button></div><div id="feed" class="stack"></div></section>
<section id="carsPage" class="page hidden"><div class="head"><h2>Arabalar</h2><input id="carSearch" placeholder="Marka, model veya kullanıcı ara" oninput="loadVehicles()"></div><button onclick="toggleCarForm()">+ ARACIMI EKLE</button><div id="carForm" class="card hidden"><div class="grid"><input id="carBrand" placeholder="Marka"><input id="carModel" placeholder="Model"><input id="carYear" placeholder="Model yılı"><input id="carEngine" placeholder="Motor (örn. 2.0)"><select id="carFuel"><option value="">Yakıt</option><option>Benzin</option><option>Dizel</option><option>LPG</option><option>Hibrit</option><option>Elektrik</option></select><input id="carHp" placeholder="Beygir"><input id="carPlate" placeholder="Plaka"><label><input id="carPlateVisible" type="checkbox"> Plaka görünür</label></div><input id="carPhoto" type="file" accept="image/*"><textarea id="carNote" placeholder="Araç hakkında not"></textarea><button onclick="createVehicle()">KAYDET</button></div><div id="vehicles" class="cars"></div></section>
<section id="peoplePage" class="page hidden"><div class="head"><h2>Kullanıcılar</h2><input id="peopleSearch" placeholder="Kullanıcı ara" oninput="loadPeople()"></div><div id="people" class="stack"></div></section>
<section id="messagesPage" class="page hidden"><div class="messages"><div><h2>Mesajlar</h2><div id="conversations" class="stack"></div></div><div class="chat"><div id="chatTitle"><b>Bir sohbet seç</b></div><div id="chatMessages" class="chat-messages"></div><div class="send"><input id="chatInput" placeholder="Mesaj yaz"><button onclick="sendMessage()">GÖNDER</button></div></div></div></section>
<section id="profilePage" class="page hidden"><div id="profileBox"></div></section><section id="adminPage" class="page hidden"><h2>Yönetim</h2><div id="adminStats" class="stats"></div><h3>Şikâyetler</h3><div id="adminReports" class="stack"></div></section>
</main></section><script src="/static/app.js"></script></body></html>
